# Plainsong Xcode project manifest (XcodeGen).
# The .xcodeproj is GENERATED — edit this file, then run `make generate` (agent.md §15).
name: Plainsong
options:
  bundleIdPrefix: app.plainsong
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
    iOS: "26.0"

fileGroups:
  - agent.md
  - Fixtures

packages:
  MarkdownCore:
    path: Packages/MarkdownCore
  Yams:
    url: https://github.com/jpsim/Yams.git
    from: 6.2.2
  EditorKit:
    path: Packages/EditorKit
  PreviewKit:
    path: Packages/PreviewKit
  WorkspaceKit:
    path: Packages/WorkspaceKit

  SyntaxKit:
    path: Packages/SyntaxKit
  WorkspaceCore:
    path: Packages/WorkspaceCore
  EditorKitIOS:
    path: Packages/EditorKitIOS
  WorkspaceKitIOS:
    path: Packages/WorkspaceKitIOS

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1

targets:
  Plainsong:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
          - "*.entitlements"
          - "Resources/preview"
      - path: App/Resources/preview
        type: folder
        buildPhase: resources
    dependencies:
      - package: MarkdownCore
      - package: EditorKit
      - package: PreviewKit
      - package: WorkspaceKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.plainsong.editor
        PRODUCT_NAME: Plainsong
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        # Scripts/release.sh passes PLAINSONG_STRIP_SHIPPED_BINARY=YES, so only the
        # shipped app is stripped: Release test runs (the perf harness) still link
        # their bundles against an unstripped app, and SwiftPM's object-file
        # targets are never stripped (a command-line STRIP_* override strips them
        # too and fails the build).
        PLAINSONG_STRIP_SHIPPED_BINARY: NO
      configs:
        Release:
          DEPLOYMENT_POSTPROCESSING: $(PLAINSONG_STRIP_SHIPPED_BINARY)
          STRIP_INSTALLED_PRODUCT: $(PLAINSONG_STRIP_SHIPPED_BINARY)
          STRIP_STYLE: all
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 w3d-su"
        NSHighResolutionCapable: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Default
            LSItemContentTypes:
              - net.daringfireball.markdown
          - CFBundleTypeName: MDX Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - app.plainsong.mdx
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo:
              - public.plain-text
            UTTypeTagSpecification:
              public.filename-extension:
                - md
                - markdown
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: app.plainsong.mdx
            UTTypeDescription: MDX Document
            UTTypeConformsTo:
              - public.plain-text
            UTTypeTagSpecification:
              public.filename-extension:
                - mdx
    entitlements:
      path: App/Plainsong.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.network.client: true
        com.apple.security.print: true
    scheme:
      testTargets:
        - PlainsongUITests
        - PlainsongTests
        - PerformanceTests

  PlainsongTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AppTests
      - path: Fixtures/large-1mb.md
        buildPhase: resources
      - path: Fixtures/export-e0-markdown.md
        buildPhase: resources
      - path: Fixtures/export-e0-mdx.mdx
        buildPhase: resources
      - path: Fixtures/export-f-markdown.md
        buildPhase: resources
      - path: Fixtures/export-f-mdx.mdx
        buildPhase: resources
      - path: Fixtures/math.md
        buildPhase: resources
      - path: Fixtures/perf-500kb.md
        buildPhase: resources
      - path: Fixtures/math-dense-100kb.md
        buildPhase: resources
      - path: Fixtures/perf-100kb.md
        buildPhase: resources
      - path: Fixtures/kitchen-sink.md
        buildPhase: resources
      - path: Fixtures/kitchen-sink.mdx
        buildPhase: resources
    dependencies:
      - target: Plainsong
      - sdk: PDFKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.plainsong.editor.tests
        GENERATE_INFOPLIST_FILE: YES

  PerformanceTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PerformanceTests
      - path: Fixtures
        type: folder
        buildPhase: resources
      - path: App/Resources/preview
        type: folder
        buildPhase: resources
      - path: Scripts/performance-required-resources.txt
        buildPhase: resources
    scheme:
      testTargets:
        - PerformanceTests
    dependencies:
      - target: Plainsong
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.plainsong.editor.performance-tests
        GENERATE_INFOPLIST_FILE: YES

  PlainsongUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: PlainsongUITests
    dependencies:
      - target: Plainsong
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.plainsong.editor.ui-tests
        GENERATE_INFOPLIST_FILE: YES

  # Production composition uses the reviewed UIKit preview provider.
  PlainsongIOS:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: AppIOS
        excludes:
          - Info.plist
          - "**/.gitkeep"
      - path: App/Resources/preview
        type: folder
        buildPhase: resources
    dependencies:
      - package: MarkdownCore
      - package: SyntaxKit
      - package: WorkspaceCore
      - package: EditorKitIOS
      - package: WorkspaceKitIOS
      - package: PreviewKit
        product: PreviewKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.plainsong.editor.ios
        PRODUCT_NAME: PlainsongIOS
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
    info:
      path: AppIOS/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Same document types as the Mac app: .md/.markdown (imported UTI) and
        # .mdx (exported UTI). Opening in place keeps Files/iCloud semantics —
        # no copy-to-container masquerade (contracts.md §4).
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Default
            LSItemContentTypes:
              - net.daringfireball.markdown
          - CFBundleTypeName: MDX Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - app.plainsong.mdx
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown Document
            UTTypeConformsTo:
              - public.plain-text
            UTTypeTagSpecification:
              public.filename-extension:
                - md
                - markdown
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: app.plainsong.mdx
            UTTypeDescription: MDX Document
            UTTypeConformsTo:
              - public.plain-text
            UTTypeTagSpecification:
              public.filename-extension:
                - mdx
        CFBundleDisplayName: Plainsong
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  PlainsongIOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: AppIOSTests
        excludes:
          - "**/.gitkeep"
    dependencies:
      - target: PlainsongIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.plainsong.editor.ios.tests
        GENERATE_INFOPLIST_FILE: YES

  # A real app process without statically duplicating the packages in its test bundle.
  # It has no providers and never participates in production composition.
  IOSPreviewTestHost:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Scripts/ios/PreviewTestHost
      - path: App/Resources/preview
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.plainsong.editor.ios.preview-test-host
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic

  # Full original lane 07 suite, in its own serial app-hosted scheme.
  IOSPreviewTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Packages/PreviewKit/Tests/PreviewKitTests
        excludes:
          # Opt-in paired benchmarks remain available through SwiftPM.
          - PreviewRenderDispatchProbeTests.swift
    dependencies:
      - target: IOSPreviewTestHost
      - package: PreviewKit
      - package: MarkdownCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.plainsong.editor.ios.preview-tests
        GENERATE_INFOPLIST_FILE: YES

  # Lane 11 hosted smoke. Kept off the PlainsongIOS scheme so a 0-run or
  # all-skip acceptance action cannot inherit the module suite's result.
  IOSAcceptanceUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: IOSAcceptanceTests/UI
    dependencies:
      - target: PlainsongIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.plainsong.editor.ios.acceptance-ui
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PlainsongIOS

schemes:
  PlainsongIOS:
    build:
      targets:
        PlainsongIOS: all
    test:
      targets:
        - name: PlainsongIOSTests
          parallelizable: false
        - package: MarkdownCore/MarkdownCoreTests
          parallelizable: false
          selectedTests:
            - IOSDocumentContractTests
        - package: SyntaxKit/SyntaxKitTests
          parallelizable: false
        - package: WorkspaceCore/WorkspaceCoreTests
          parallelizable: false
        - package: EditorKitIOS/EditorKitIOSTests
          parallelizable: false
        - package: WorkspaceKitIOS/WorkspaceKitIOSTests
          parallelizable: false
  IOSPreview:
    build:
      targets:
        IOSPreviewTestHost: [run, test]
        IOSPreviewTests: [test]
    test:
      config: Debug
      targets:
        - name: IOSPreviewTests
          parallelizable: false
  IOSAcceptance:
    build:
      targets:
        PlainsongIOS: [run, test]
        IOSAcceptanceUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: IOSAcceptanceUITests
          parallelizable: false
