# ── proposed project.yml additions for lane 12 (after 13→12 handoff) ──
#
# Purely additive: Mac targets (Plainsong, PlainsongTests, PerformanceTests,
# PlainsongUITests), macOS 14.0 deployment target, resources and scheme test
# lists keep their current values. Target/product names below are the ones C0
# must freeze — see wiring-requests.md; do not invent alternates at wiring time.

options:
  deploymentTarget:
    macOS: "14.0"     # unchanged
    iOS: "26.0"       # contracts.md §1: SPM/Xcode min iOS/iPadOS 26

packages:
  # existing Mac packages unchanged; added per C0 manifest names:
  SyntaxKit:        { path: Packages/SyntaxKit }
  WorkspaceCore:    { path: Packages/WorkspaceCore }
  EditorKitIOS:     { path: Packages/EditorKitIOS }
  # WorkspaceKitIOS manifest is 13-owned; referenced by path like the others.
  WorkspaceKitIOS:  { path: Packages/WorkspaceKitIOS }

targets:
  PlainsongIOS:
    type: application
    platform: iOS
    sources:
      - path: AppIOS
        excludes:
          - "Info.plist"
          - "*.entitlements"
      # Same committed preview bundle as the Mac target — never a second copy.
      - path: App/Resources/preview
        type: folder
        buildPhase: resources
    dependencies:
      - package: MarkdownCore
      - package: SyntaxKit
      - package: WorkspaceCore
      - package: EditorKitIOS
      - package: WorkspaceKitIOS
      - package: PreviewKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.plainsong.editor.ios   # distinct from Mac
        PRODUCT_NAME: PlainsongIOS
        TARGETED_DEVICE_FAMILY: "1,2"                          # iPhone + iPad
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon            # TBD: C0/10 asset
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # No Mac sandbox / hardened-runtime / bookmark entitlements on iOS.
        # Entitlements file (if any) is minimal and decided by 13's C0 scaffold.
    info:
      path: AppIOS/Info.plist                                  # generated; 13 adds .gitignore rule
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSSupportsOpeningDocumentsInPlace: true
        UISupportsDocumentBrowser: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Default
            LSItemContentTypes: [net.daringfireball.markdown]
          - CFBundleTypeName: MDX Document
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [app.plainsong.mdx]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    scheme:
      testTargets:
        - AppIOSTests
        - IOSAcceptanceTests

  AppIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppIOSTests
    dependencies:
      - target: PlainsongIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.plainsong.editor.ios.tests
        GENERATE_INFOPLIST_FILE: YES

  IOSAcceptanceTests:                       # sources+kind owned by lane 11
    type: bundle.unit-test                  # or bundle.ui-testing — 11 decides
    platform: iOS
    sources:
      - path: IOSAcceptanceTests
    dependencies:
      - target: PlainsongIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.plainsong.editor.ios.acceptance-tests
        GENERATE_INFOPLIST_FILE: YES
