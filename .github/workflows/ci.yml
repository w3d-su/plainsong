name: CI

# Every commit on main runs the full suite, without cancellation, and seeds the
# caches every pull request restores (a pull request can read main's caches but
# not another pull request's). Docs-only pushes are filtered here. Pull requests
# have no path filter: a filtered run never reports the required `build-and-test`
# check, which would block the merge, so the `changes` job classifies them instead.
# The `paths` entries are last-match-wins, and the two re-included docs paths are
# test inputs (see `changes`).
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "**"
      - "!docs/**"
      - "docs/perf-log.md"
      - "docs/evidence/**"
      - "!*.md"
      - "!LICENSE"
  workflow_dispatch:

# A newer push to a pull request replaces its running build. Every other run gets
# its own group: a shared group would keep only the newest waiting run, silently
# dropping main commits, even with cancel-in-progress off.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Jobs only read the checkout; cache and artifact actions use the runtime
# token, not GITHUB_TOKEN.
permissions:
  contents: read

# The suite runs as parallel jobs. The `build-and-test` job at the bottom keeps the
# check name the main ruleset requires and passes only when every job passed, or
# when `changes` found a docs-only pull request and the test jobs were skipped.
# Everything that does not need macOS runs on Ubuntu. A run holds at most five macOS
# runners (`packages` plus four shards), GitHub's cap for non-Enterprise accounts;
# when two pull requests run at once, the second run's jobs wait for a free runner.
jobs:
  # Docs-only fast path. A pull request counts as docs-only when every path it
  # changes is under docs/ or is a top-level *.md or LICENSE file. Two docs paths
  # are test inputs and still run everything: `make test-packages` reads
  # docs/perf-log.md and docs/evidence/** (Scripts/editor_find_f2_evidence_tests).
  # Deleting a top-level file also runs everything, because project.yml lists
  # agent.md. workflow_dispatch always runs the full suite.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      # A pull_request checkout is GitHub's test merge commit, the tree every job
      # below tests; depth 2 adds its first parent, the base branch tip. The diff
      # below reads trees, never file contents, so a sparse checkout (which
      # actions/checkout fetches blobless) skips downloading the repository.
      - uses: actions/checkout@v4
        if: ${{ github.event_name == 'pull_request' }}
        with:
          fetch-depth: 2
          sparse-checkout: .github

      - name: Classify changed paths
        id: classify
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "$GITHUB_EVENT_NAME runs the full suite."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames lists a move as a delete plus an add, so every record is
          # one status and one path and a move's source path is classified too;
          # -z keeps unusual file names literal.
          git diff --name-status --no-renames -z HEAD^1 HEAD > "$RUNNER_TEMP/changed-paths"
          docs_only=true
          changed=0
          while IFS= read -r -d '' status && IFS= read -r -d '' path; do
            changed=$((changed + 1))
            case "$path" in
              docs/perf-log.md | docs/evidence/*) verdict="test input" ;;
              docs/*) verdict=docs ;;
              */*) verdict=code ;;
              *.md | LICENSE) if [ "$status" = D ]; then verdict="deleted top-level file"; else verdict=docs; fi ;;
              *) verdict=code ;;
            esac
            printf '%s\t%s\t%s\n' "$status" "$verdict" "$path"
            [ "$verdict" = docs ] || docs_only=false
          done < "$RUNNER_TEMP/changed-paths"
          # An empty diff is not evidence of a docs-only change.
          [ "$changed" -gt 0 ] || docs_only=false
          echo "$changed changed paths; docs_only=$docs_only"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  preview:
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate committed acceptance resources
        run: sha256sum --strict -c IOSAcceptanceTests/Resources/acceptance-resource-manifest.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: preview-src/package-lock.json

      - name: Install preview dependencies
        run: |
          cd preview-src
          npm ci

      - name: Typecheck preview
        run: cd preview-src && npm run typecheck

      - name: Test preview
        run: make test-preview

  # SwiftFormat and SwiftLint parse text and do not care which OS runs them. Both are
  # pinned to exact release binaries instead of `brew install`: Homebrew tracks the
  # latest release, and a runner-image bump from SwiftFormat 0.62.1 to 0.63.0
  # (2026-09-18) changed the `indent` rule enough to fail `make lint` on untouched
  # files, turning every PR red without any code change. These versions and SHA-256s
  # are the single source of truth with the Makefile constants; bump them together
  # in a PR that also reformats the tree if the new release changes rule behavior.
  lint:
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SWIFTFORMAT_VERSION: "0.62.1"
      SWIFTFORMAT_LINUX_SHA256: "61ff55f3581e2144a4ad114831167102c38be853df75c1477d20b40a8e8120aa"
      SWIFTLINT_VERSION: "0.65.1"
      SWIFTLINT_LINUX_SHA256: "caeed6f4a679c35539ffaf124f6c4ab4a8416917f7d8796279dc52b74026059d"
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned swiftformat and swiftlint
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/lint-tools"
          mkdir -p "$install_dir"
          curl -fsSL --retry 3 -o "$install_dir/swiftformat.zip" \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/$SWIFTFORMAT_VERSION/swiftformat_linux.zip"
          curl -fsSL --retry 3 -o "$install_dir/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/$SWIFTLINT_VERSION/swiftlint_linux_amd64.zip"
          sha256sum -c - <<EOF
          $SWIFTFORMAT_LINUX_SHA256  $install_dir/swiftformat.zip
          $SWIFTLINT_LINUX_SHA256  $install_dir/swiftlint.zip
          EOF
          unzip -oq "$install_dir/swiftformat.zip" swiftformat_linux -d "$install_dir"
          unzip -oq "$install_dir/swiftlint.zip" swiftlint-static -d "$install_dir"
          mv "$install_dir/swiftformat_linux" "$install_dir/swiftformat"
          mv "$install_dir/swiftlint-static" "$install_dir/swiftlint"
          chmod +x "$install_dir/swiftformat" "$install_dir/swiftlint"
          echo "$install_dir" >> "$GITHUB_PATH"
          for tool in swiftformat swiftlint; do
            actual="$("$install_dir/$tool" --version)"
            expected="$SWIFTFORMAT_VERSION"
            [ "$tool" = swiftformat ] || expected="$SWIFTLINT_VERSION"
            if [ "$actual" != "$expected" ]; then
              echo "pinned $tool $expected but binary reports $actual" >&2
              exit 1
            fi
            echo "$tool: $actual (pinned)"
          done

      # SwiftFormat's cache is keyed by file content, tool version and options, so an
      # unchanged file is not reformatted. The cache is a few hundred kilobytes.
      - name: Cache SwiftFormat results
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/swiftformat-cache
          key: swiftformat-${{ env.SWIFTFORMAT_VERSION }}-${{ hashFiles('.swiftformat', 'Makefile') }}-${{ github.run_id }}
          restore-keys: swiftformat-${{ env.SWIFTFORMAT_VERSION }}-${{ hashFiles('.swiftformat', 'Makefile') }}-

      - name: Lint
        run: make lint SWIFTFORMAT_CACHE="$RUNNER_TEMP/swiftformat-cache"

      - name: Test evidence tooling
        run: make test-f2-tooling

  packages:
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          brew install xcodegen
          echo "xcodegen: $(xcodegen --version)"

      - name: Cache Swift package builds
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            Packages/MarkdownCore/.build
            Packages/EditorKit/.build
            Packages/PreviewKit/.build
            Packages/WorkspaceKit/.build
            Packages/SyntaxKit/.build
            Packages/WorkspaceCore/.build
          key: spm-v2-${{ runner.os }}-${{ hashFiles('Packages/**/Package.swift', 'Packages/**/Package.resolved') }}
          restore-keys: spm-v2-${{ runner.os }}-

      - name: Test packages
        run: make test-packages-native

  # Hosted XCTest bundles: one job builds every bundle once (~3 min) and the shards
  # run the same products. Measured class times on macos-15 (run 41334692636):
  # EditorFindHostedGateTests 161 s of PlainsongTests' 375 s, WorkspaceSearchAcceptance
  # Tests 186 s of PlainsongUITests' 346 s, PerformanceTests 49 s. A shard that names a
  # class also skips it elsewhere, so a renamed or new class always still runs.
  hosted-build:
    name: hosted (build)
    needs: changes
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    runs-on: macos-15
    timeout-minutes: 20
    env:
      SHARD: build
    steps:
      - uses: actions/checkout@v4

      - &prepare-evidence
        name: Prepare CI evidence paths
        run: |
          artifact_dir="$RUNNER_TEMP/plainsong-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$SHARD"
          mkdir -p "$artifact_dir"
          {
            printf 'XCODE_ARTIFACT_DIR=%s\n' "$artifact_dir"
            printf 'XCODE_RESULT_BUNDLE=%s/Results.xcresult\n' "$artifact_dir"
            printf 'XCODE_DERIVED_DATA=%s/plainsong-dd\n' "$RUNNER_TEMP"
          } >> "$GITHUB_ENV"

      - name: Install tools
        run: |
          brew install xcodegen
          echo "xcodegen: $(xcodegen --version)"

      - name: Cache Xcode package checkouts
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/plainsong-dd/SourcePackages
          key: xcode-spm-${{ hashFiles('project.yml', 'Packages/**/Package.swift', 'Packages/**/Package.resolved') }}
          restore-keys: xcode-spm-

      - name: Build for testing
        run: make test-hosted-build

      - name: Check built update configuration
        run: Scripts/check-shipped-update-configuration.sh "$XCODE_DERIVED_DATA/Build/Products/Debug/Plainsong.app/Contents/Info.plist"

      # tar keeps the symlinks and signatures an artifact zip would lose. Objects and
      # module files only serve the link step, which is finished.
      - name: Package test products
        run: |
          set -euo pipefail
          du -sh "$XCODE_DERIVED_DATA/Build/Products"
          tar -C "$XCODE_DERIVED_DATA/Build" --exclude '*.o' --exclude '*.swiftmodule' --exclude '*.dSYM' -cf - Products \
            | zstd -T0 -3 -o "$RUNNER_TEMP/hosted-products.tar.zst"
          ls -lh "$RUNNER_TEMP/hosted-products.tar.zst"

      # No attempt in the name: re-running a failed shard reuses this run's products.
      - name: Upload test products
        uses: actions/upload-artifact@v4
        with:
          name: hosted-products-${{ github.run_id }}
          path: ${{ runner.temp }}/hosted-products.tar.zst
          compression-level: 0
          overwrite: true
          retention-days: 1
          if-no-files-found: error

      - &capture-failure-environment
        name: Capture failure environment
        if: ${{ failure() || cancelled() }}
        run: |
          artifact_dir="${XCODE_ARTIFACT_DIR:-$RUNNER_TEMP/plainsong-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$SHARD}"
          mkdir -p "$artifact_dir"
          printf 'XCODE_ARTIFACT_DIR=%s\n' "$artifact_dir" >> "$GITHUB_ENV"
          {
            printf 'ImageOS=%s\nImageVersion=%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
            xcodebuild -version
            df -h "$RUNNER_TEMP"
            printf 'ulimit -n: '
            ulimit -n
          } > "$artifact_dir/environment.txt"

      # Capture only the designated runner-temp evidence directory, never DerivedData,
      # caches, the workspace, environment dumps or home-directory contents.
      - &keep-failure-evidence
        name: Keep failure evidence
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: plainsong-ci-failure-${{ env.SHARD }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.XCODE_ARTIFACT_DIR }}/
          retention-days: 14
          if-no-files-found: warn

  hosted:
    name: hosted (${{ matrix.shard }})
    needs: [changes, hosted-build]
    if: ${{ needs.changes.outputs.docs_only != 'true' }}
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: app-gates
            targets: PlainsongTests/EditorFindHostedGateTests PerformanceTests
          - shard: app-rest
            targets: PlainsongTests
            skip: PlainsongTests/EditorFindHostedGateTests
          - shard: ui-search
            targets: PlainsongUITests/WorkspaceSearchAcceptanceTests
          - shard: ui-rest
            targets: PlainsongUITests
            skip: PlainsongUITests/WorkspaceSearchAcceptanceTests
    env:
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4

      - *prepare-evidence

      - name: Download test products
        uses: actions/download-artifact@v4
        with:
          name: hosted-products-${{ github.run_id }}
          path: ${{ runner.temp }}

      - name: Unpack test products
        run: |
          set -euo pipefail
          mkdir -p "$XCODE_DERIVED_DATA/Build"
          zstd -dc "$RUNNER_TEMP/hosted-products.tar.zst" | tar -C "$XCODE_DERIVED_DATA/Build" -xf -
          rm "$RUNNER_TEMP/hosted-products.tar.zst"

      - name: Test ${{ matrix.targets }}
        run: make test-hosted-shard XCODE_TEST_TARGETS="${{ matrix.targets }}" XCODE_SKIP_TESTS="${{ matrix.skip }}"

      - *capture-failure-environment

      - *keep-failure-evidence

  # Required status check (main ruleset): keep this job id. Any failed or
  # cancelled job above fails it. A skipped job fails it too, unless `changes`
  # succeeded and reported a docs-only pull request.
  build-and-test:
    if: ${{ always() }}
    needs: [changes, lint, preview, packages, hosted-build, hosted]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every CI job to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -r '"docs_only: \(.changes.outputs.docs_only // "unset")"'
          echo "$NEEDS" | jq -e '
            (.changes.result == "success" and .changes.outputs.docs_only == "true") as $docs_only
            | all(.[]; .result == "success" or ($docs_only and .result == "skipped"))' > /dev/null
