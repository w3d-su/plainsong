name: CI

# No push trigger: main is protected and only receives squash merges of
# PR-validated commits, so a push build duplicates the PR build at 10x
# private-repo macOS pricing (this exhausted the June 2026 Actions quota).
# Use workflow_dispatch to verify main on demand.
on:
  pull_request:
  workflow_dispatch:

# Private-repo macOS minutes are expensive (10x multiplier): never run two
# builds for the same ref at once.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          brew install xcodegen swiftlint
          echo "xcodegen: $(xcodegen --version)"
          echo "swiftlint: $(swiftlint --version)"

      # swiftformat is pinned to an exact release binary instead of `brew install`.
      # Homebrew tracks the latest release, and a runner-image bump from 0.62.1 to
      # 0.63.0 (2026-09-18) changed the `indent` rule enough to fail `make lint` on
      # untouched files, turning every PR red without any code change. The pinned
      # version and SHA-256 are the single source of truth; bump both together in a
      # PR that also reformats the tree if the new release changes rule behavior.
      - name: Install pinned swiftformat
        env:
          SWIFTFORMAT_VERSION: "0.62.1"
          SWIFTFORMAT_SHA256: "7cb1cb1fae04932047c7015441c543848e8e60e1572d808d080e0a1f1661114a"
        run: |
          set -euo pipefail
          install_dir="$RUNNER_TEMP/swiftformat-$SWIFTFORMAT_VERSION"
          mkdir -p "$install_dir"
          curl -fsSL --retry 3 \
            -o "$install_dir/swiftformat.zip" \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/$SWIFTFORMAT_VERSION/swiftformat.zip"
          echo "$SWIFTFORMAT_SHA256  $install_dir/swiftformat.zip" | shasum -a 256 -c -
          unzip -oq "$install_dir/swiftformat.zip" -d "$install_dir"
          chmod +x "$install_dir/swiftformat"
          echo "$install_dir" >> "$GITHUB_PATH"
          actual="$("$install_dir/swiftformat" --version)"
          if [ "$actual" != "$SWIFTFORMAT_VERSION" ]; then
            echo "pinned swiftformat $SWIFTFORMAT_VERSION but binary reports $actual" >&2
            exit 1
          fi
          echo "swiftformat: $actual (pinned)"

      - name: Verify swiftformat on PATH
        run: |
          echo "resolved: $(command -v swiftformat)"
          echo "swiftformat: $(swiftformat --version)"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: preview-src/package-lock.json

      - name: Cache Swift package builds
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            Packages/MarkdownCore/.build
            Packages/EditorKit/.build
            Packages/PreviewKit/.build
            Packages/WorkspaceKit/.build
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/**/Package.swift', 'Packages/**/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Install preview dependencies
        run: |
          cd preview-src
          npm ci

      - name: Typecheck preview
        run: cd preview-src && npm run typecheck

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build app
        run: make build
