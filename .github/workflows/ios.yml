# iOS CI — lane 12 (docs/ios/handoffs/12-build-and-ipa.md, docs/ios/build-and-ipa.md).
#
# Manual-only by design: private-repo macOS minutes carry a 10x multiplier, so
# this workflow is `workflow_dispatch` only — no push/pull_request triggers.
# Evidence scope is limited to the run-temp output root; failed attempts upload
# too, and a rerun never overwrites another attempt's artifacts.
name: iOS

on:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-build-test-archive-ipa:
    # The image must carry an iOS >= 26 SDK and an installed iOS simulator
    # runtime; the toolchain step records what the image actually provides and
    # the runners fail early with an explicit message when it does not.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Record image and toolchain
        run: |
          {
            printf 'ImageOS=%s\nImageVersion=%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
            xcodebuild -version
            xcodebuild -showsdks | grep -i ios
            xcrun simctl list runtimes | grep -i ios || true
            xcodegen --version || true
          } | tee "$RUNNER_TEMP/toolchain.txt"

      - name: Install xcodegen
        run: |
          brew install xcodegen
          echo "xcodegen: $(xcodegen --version)"

      - name: Prepare iOS output root
        run: |
          out="$RUNNER_TEMP/plainsong-ios-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$out"
          printf 'IOS_OUTPUT_ROOT=%s\n' "$out" >> "$GITHUB_ENV"

      - name: Simulator runtime check
        run: |
          # macOS runner images normally ship iOS runtimes; download only as a
          # fallback. ios-test still fails early (exit 69) if none is usable —
          # a missing runtime is recorded, never faked green.
          if ! xcrun simctl list runtimes | grep -q iOS; then
            xcodebuild -downloadPlatform iOS || true
          fi
          xcrun simctl list runtimes | grep -i ios || true

      - name: Resolve IOS_DESTINATION
        run: |
          set -e
          if udid="$(Scripts/ios/ios-print-simulator-udid.sh)"; then
            printf 'IOS_DESTINATION=platform=iOS Simulator,id=%s\n' "$udid" >> "$GITHUB_ENV"
          else
            echo "No iOS >= 26 simulator on this runner; ios-test will report it" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Validate iOS tooling negative fixtures
        run: make test-ios-tooling

      - name: Simulator build
        run: make ios-build

      - name: Simulator tests
        run: make ios-test

      - name: App-hosted full PreviewKit suite
        run: make ios-preview

      - name: Acceptance component package
        run: make ios-acceptance-components

      - name: Production Files/Open launch smoke
        run: make ios-acceptance

      - name: Device archive (unsigned)
        run: make ios-archive

      - name: Unsigned IPA + metadata
        run: make ios-ipa

      - name: Upload iOS evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: plainsong-ios-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.IOS_OUTPUT_ROOT }}/evidence/
            ${{ env.IOS_OUTPUT_ROOT }}/*.ipa
            ${{ env.IOS_OUTPUT_ROOT }}/*.ipa.sha256
            ${{ env.IOS_OUTPUT_ROOT }}/archive-attempt-*/*.xcarchive-meta/
            ${{ runner.temp }}/toolchain.txt
          retention-days: 14
          if-no-files-found: warn
