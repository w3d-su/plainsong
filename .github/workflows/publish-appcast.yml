# Publishes one release's update feed to GitHub Pages
# (docs/auto-update-plan.md §3.4 step 3).
#
# The Release workflow attaches a signed appcast.xml to each tag's draft
# release. This workflow copies that file to the gh-pages branch, which serves
# https://w3d-su.github.io/plainsong/appcast.xml. The owner runs it by hand
# after publishing the release, so users are never offered a build the owner
# has not released. It holds no signing key: it publishes the file as signed.
name: Publish appcast

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the published release whose appcast.xml to publish (for example v0.9.0)"
        required: true
        type: string

permissions:
  contents: write # push appcast.xml to gh-pages

concurrency:
  group: publish-appcast
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      # The publish scripts only; they come from the branch the workflow runs on.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: Scripts/ci

      - name: Check the release
        run: |
          if [[ ! "$TAG" =~ ^v[0-9A-Za-z.+-]+$ ]]; then
            echo "::error::The tag must look like v1.2.3."
            exit 1
          fi
          draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          if [[ "$draft" != "false" ]]; then
            echo "::error::Release $TAG is still a draft. Publish it first."
            exit 1
          fi

      - name: Download the release's appcast
        run: |
          mkdir new
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern appcast.xml --dir new
          test -s new/appcast.xml

      # Only a remote that answers "no such branch" starts an empty gh-pages.
      # Any other failure stops the job: an empty branch would skip the
      # downgrade check below. The token is passed per git command and is not
      # written to pages/.git/config.
      - name: Check out gh-pages
        run: Scripts/ci/checkout-pages-branch.sh pages "https://github.com/${GITHUB_REPOSITORY}.git"

      # The new feed must name this tag's download with a signature, and in every
      # channel of the published feed its newest build must be at least the
      # published one (Scripts/ci/check-appcast-feed.py).
      # A release's feed is built from the feed that was published when its tag
      # ran, so a feed built before an earlier release was published lacks that
      # release. Publishing it would hide that release from its channel's users:
      # a beta-only feed over a stable item leaves stable users with no update.
      - name: Check the feed
        run: |
          python3 Scripts/ci/check-appcast-feed.py new/appcast.xml pages/appcast.xml "$TAG" "$GITHUB_REPOSITORY"

      - name: Publish
        run: |
          cp new/appcast.xml pages/appcast.xml
          cd pages
          # Pages must serve the file as it is, without a Jekyll build.
          touch .nojekyll
          git add appcast.xml .nojekyll
          if git diff --cached --quiet; then
            echo "::notice::gh-pages already has this feed."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "Publish the appcast for $TAG"
          "$GITHUB_WORKSPACE/Scripts/ci/git-with-token.sh" push --quiet origin gh-pages
          echo "::notice::Published the appcast for $TAG."
