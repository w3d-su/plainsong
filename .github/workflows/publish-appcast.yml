# Publishes one release's update feed to GitHub Pages
# (docs/auto-update-plan.md §3.4 step 3).
#
# The Release workflow attaches a signed appcast.xml to each tag's draft
# release. This workflow copies that file to the gh-pages branch, which serves
# https://w3d-su.github.io/plainsong/appcast.xml. The owner runs it by hand
# after publishing the release, so users are never offered a build the owner
# has not released. It holds no signing key: it publishes the file as signed.
name: Publish appcast

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of the published release whose appcast.xml to publish (for example v0.9.0)"
        required: true
        type: string

permissions:
  contents: write # push appcast.xml to gh-pages

concurrency:
  group: publish-appcast
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Check the release
        run: |
          if [[ ! "$TAG" =~ ^v[0-9A-Za-z.+-]+$ ]]; then
            echo "::error::The tag must look like v1.2.3."
            exit 1
          fi
          draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          if [[ "$draft" != "false" ]]; then
            echo "::error::Release $TAG is still a draft. Publish it first."
            exit 1
          fi

      - name: Download the release's appcast
        run: |
          mkdir new
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern appcast.xml --dir new
          test -s new/appcast.xml

      - name: Check out gh-pages
        run: |
          git init --quiet pages
          cd pages
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch --quiet --depth 1 origin gh-pages; then
            git checkout --quiet -b gh-pages FETCH_HEAD
          else
            git checkout --quiet --orphan gh-pages
          fi

      # The new feed must name this tag's download, and in every channel of the
      # published feed its newest build must be at least the published one.
      # A release's feed is built from the feed that was published when its tag
      # ran, so a feed built before an earlier release was published lacks that
      # release. Publishing it would hide that release from its channel's users:
      # a beta-only feed over a stable item leaves stable users with no update.
      - name: Check the feed
        run: |
          python3 - new/appcast.xml pages/appcast.xml "$TAG" "$GITHUB_REPOSITORY" << 'PY'
          import os
          import sys
          import xml.etree.ElementTree as ET

          new_path, current_path, tag, repository = sys.argv[1:5]
          namespace = "{http://www.andymatuschak.org/xml-namespaces/sparkle}"

          def items(path):
              found = []
              for item in ET.parse(path).getroot().iter("item"):
                  version = item.find(f"{namespace}version")
                  channel = item.find(f"{namespace}channel")
                  enclosure = item.find("enclosure")
                  found.append((
                      int(version.text.strip()),
                      enclosure.get("url", "") if enclosure is not None else "",
                      (channel.text or "").strip() if channel is not None else "",
                  ))
              return found

          def newest_by_channel(found):
              newest = {}
              for version, _, channel in found:
                  newest[channel] = max(version, newest.get(channel, version))
              return newest

          new = items(new_path)
          if not new:
              sys.exit("error: the release's appcast.xml has no items")
          prefix = f"https://github.com/{repository}/releases/download/{tag}/"
          if not any(url.startswith(prefix) for _, url, _ in new):
              sys.exit(f"error: no item downloads from {prefix}")
          for _, url, _ in new:
              if not url.startswith(f"https://github.com/{repository}/releases/download/"):
                  sys.exit(f"error: an item downloads from outside this repository's releases: {url}")
          current = items(current_path) if os.path.exists(current_path) else []
          if current:
              newest_new = max(v for v, _, _ in new)
              newest_published = max(v for v, _, _ in current)
              if newest_new < newest_published:
                  sys.exit(
                      f"error: the published feed already has build {newest_published}, and this "
                      f"release's feed stops at build {newest_new}. An older release cannot be "
                      "added behind a newer one: tag a new release."
                  )
              new_newest = newest_by_channel(new)
              for channel, published in sorted(newest_by_channel(current).items()):
                  if new_newest.get(channel, -1) < published:
                      name = channel or "default"
                      have = f"stops at build {new_newest[channel]}" if channel in new_newest else "has no item"
                      sys.exit(
                          f"error: the published feed has build {published} in the {name} channel, "
                          f"and this release's feed {have} in that channel. It was built before "
                          f"that build's feed was published. Re-run the Release workflow for {tag} "
                          "to rebuild its feed from the published one."
                      )
          print(f"feed ok: builds {sorted(v for v, _, _ in new)}")
          PY

      - name: Publish
        run: |
          cp new/appcast.xml pages/appcast.xml
          cd pages
          # Pages must serve the file as it is, without a Jekyll build.
          touch .nojekyll
          git add appcast.xml .nojekyll
          if git diff --cached --quiet; then
            echo "::notice::gh-pages already has this feed."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "Publish the appcast for $TAG"
          git push --quiet origin gh-pages
          echo "::notice::Published the appcast for $TAG."
