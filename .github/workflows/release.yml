# Unsigned alpha release pipeline (docs/release-engineering-plan.md P4).
# Tag-only + manual dispatch, never per-push (2026-07-02 CI-cost Decision Log
# entry). Public-repo macOS minutes are free. The signed path stays manual
# until P1/P2 resume.
#
# One secret, SPARKLE_ED_PRIVATE_KEY, signs the update feed
# (docs/decisions/2026-11-10-auto-update-feed-secret-and-signed-feed.md). Only
# the "Build the update feed" step of a tag run receives it. This workflow has
# no pull_request trigger, so code from a pull request never runs with it.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create/upload the GitHub Release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the build number is `git rev-list --count HEAD`.
          fetch-depth: 0

      - name: Install tools
        run: brew install xcodegen

      - name: Build unsigned release DMG
        run: PLAINSONG_UNSIGNED=1 make release

      - name: Checksum summary
        run: cat build/release/*.sha256

      # Exercises Scripts/make-appcast.sh with the Sparkle tools this build
      # resolved and a throwaway key, on tag and dispatch runs alike.
      - name: Appcast self-test
        run: Scripts/make-appcast.sh --self-test

      # Tag runs: add this build to the published feed and sign it. The result
      # is attached to the draft release below; users see it only after the
      # owner publishes the release and runs the "Publish appcast" workflow.
      # A tag with a hyphen (v0.9.0-beta.1) goes to the beta channel.
      # Skipped while the secret or the app's SUPublicEDKey is absent, unless
      # the build has updates on.
      - name: Build the update feed (tags)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          plist=build/release/DerivedData/Build/Products/Release/Plainsong.app/Contents/Info.plist
          updates="$(/usr/libexec/PlistBuddy -c 'Print :PLAINSONG_UPDATES_ENABLED' "$plist")"
          public_key="$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$plist" 2>/dev/null || true)"
          # A feed needs both halves of the key pair: the secret here and the
          # public key in the app. A build with neither half or only one half
          # gets no feed, and that is an error once the build has updates on.
          missing=""
          if [[ -z "$SPARKLE_ED_PRIVATE_KEY" ]]; then
            missing="SPARKLE_ED_PRIVATE_KEY is not set"
          elif [[ -z "${public_key//[[:space:]]/}" ]]; then
            missing="the app has no SUPublicEDKey"
          fi
          if [[ -n "$missing" ]]; then
            if [[ "$updates" != "NO" ]]; then
              echo "::error::This build has updates on, but $missing."
              exit 1
            fi
            echo "::notice::Updates are off in this build and $missing: no feed."
            exit 0
          fi
          mkdir -p build/appcast
          # Only a missing gh-pages branch (exit 2) means there is no published
          # feed yet. Any other failure stops the job: a feed built without the
          # published one would drop every earlier release from it.
          pages=0
          git ls-remote --exit-code --heads origin gh-pages >/dev/null || pages=$?
          if [[ "$pages" == 0 ]]; then
            git fetch --depth 1 origin gh-pages
            if git cat-file -e FETCH_HEAD:appcast.xml 2>/dev/null; then
              git show FETCH_HEAD:appcast.xml > build/appcast/appcast.xml
            fi
          elif [[ "$pages" != 2 ]]; then
            echo "::error::Could not read the gh-pages branch (git ls-remote exit $pages)."
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" --jq .body > build/release-notes.md
          channel=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            channel=(--channel beta)
          fi
          Scripts/make-appcast.sh --dmg build/release/Plainsong-*-unsigned.dmg \
            --tag "$GITHUB_REF_NAME" --feed-dir build/appcast \
            --release-notes build/release-notes.md "${channel[@]}"

      # Every run keeps the dSYM, so crash reports from this exact (stripped)
      # build can be symbolicated. It is deliberately never a Release asset.
      # Artifacts expire: download it for any build that gets published.
      - name: Upload dSYM (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: plainsong-dsym
          path: build/release/*.dSYM.zip
          if-no-files-found: error
          retention-days: 90

      # Tag runs: attach the DMG + checksum to the tag's GitHub Release.
      # Created as a DRAFT prerelease when absent so the owner still writes
      # the notes and presses publish.
      - name: Publish to GitHub Release (tags)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(build/release/Plainsong-*-unsigned.dmg build/release/Plainsong-*-unsigned.dmg.sha256)
          if [[ -f build/appcast/appcast.xml ]]; then
            assets+=(build/appcast/appcast.xml)
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --prerelease --generate-notes "${assets[@]}"
          fi

      # Dispatch runs (pipeline verification without a tag): keep the DMG as a
      # workflow artifact instead of touching Releases.
      - name: Upload workflow artifact (dispatch)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: plainsong-unsigned-dmg
          path: |
            build/release/*.dmg
            build/release/*.sha256
